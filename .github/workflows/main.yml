name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/brand-logo-recognition
      - feature/credit-brands-and-cheque

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Download approved cheque reference image
        run: |
          mkdir -p brand-assets/references
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://i1.delgarm.com/i/813/020901/655d317f020e5.gif" \
            --output brand-assets/references/bank-cheque.gif
          file brand-assets/references/bank-cheque.gif
          test "$(stat -c%s brand-assets/references/bank-cheque.gif)" -gt 5000

      - name: Download user-provided Basalam logo for Basalam and SalamPay
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://statics.basalam.com/public-81/admin/0Vlq5j/05-12/fbLmC9QTrqwir7qCYUD9M5qAMoeEXiZw9HdwWHCkbW7LcrALwJ.png" \
            --output /tmp/basalam-logo.png
          file /tmp/basalam-logo.png
          test "$(stat -c%s /tmp/basalam-logo.png)" -gt 1000
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/basalam-logo.png").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/basalam-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/basalam-color.svg
          test "$(stat -c%s brand-assets/logos/basalam-color.svg)" -gt 1000

      - name: Download user-provided Torob Pay logo
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://techfy.ir/wp-content/uploads/2025/09/%D8%AA%D8%B1%D8%A8-%D9%BE%DB%8C-%DA%86%DB%8C%D8%B3%D8%AA%D8%9F.webp" \
            --output /tmp/torob-pay-logo.webp
          file /tmp/torob-pay-logo.webp
          test "$(stat -c%s /tmp/torob-pay-logo.webp)" -gt 1000
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/torob-pay-logo.webp").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/webp;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/torob-pay-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/torob-pay-color.svg
          test "$(stat -c%s brand-assets/logos/torob-pay-color.svg)" -gt 1000

      - name: Download user-provided Talasea logo
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://media.licdn.com/dms/image/v2/D4E0BAQGzL4Y_UyjYxA/company-logo_200_200/B4EZ2gAXyeIMAI-/0/1776505946013/talasea_logo?e=2147483647&v=beta&t=c4JeWONZcZwwEYCxZmaIPMyUw3M9bK-LE1NAdAK_5vc" \
            --output /tmp/talasea-logo
          file /tmp/talasea-logo
          test "$(stat -c%s /tmp/talasea-logo)" -gt 500
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path("/tmp/talasea-logo")
          raw = p.read_bytes()
          mime = "image/jpeg" if raw.startswith(bytes([255, 216, 255])) else ("image/webp" if raw[8:12] == b"WEBP" else "image/png")
          data = base64.b64encode(raw).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:' + mime + ';base64,' + data + '"/></svg>'
          Path("brand-assets/logos/talasea-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/talasea-color.svg

      - name: Download user-provided Asiatech logo
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIAjy5YF9L2RnoWn_jqUKM31SYZADG_fr77A&s" \
            --output /tmp/asiatech-logo
          file /tmp/asiatech-logo
          test "$(stat -c%s /tmp/asiatech-logo)" -gt 500
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          source = Image.open("/tmp/asiatech-logo").convert("RGBA")
          width, height = source.size

          # Detect the source image's own background from its four corner patches.
          patch = max(1, min(width, height, 12))
          pixels = []
          for left, top in ((0, 0), (width-patch, 0), (0, height-patch), (width-patch, height-patch)):
              crop = source.crop((left, top, left+patch, top+patch))
              pixels.extend(list(crop.getdata()))
          opaque = [p for p in pixels if p[3] > 220]
          if opaque:
              rgb = tuple(sorted(p[i] for p in opaque)[len(opaque)//2] for i in range(3))
              background = "#{:02X}{:02X}{:02X}".format(*rgb)
          else:
              background = "#FFFFFF"

          # Keep the complete original image proportional, centered on a square canvas.
          scale = min(512 / width, 512 / height)
          fitted_width = round(width * scale)
          fitted_height = round(height * scale)
          data = base64.b64encode(Path("/tmp/asiatech-logo").read_bytes()).decode("ascii")
          fmt = Image.open("/tmp/asiatech-logo").format
          mime = {"PNG":"image/png", "WEBP":"image/webp", "JPEG":"image/jpeg"}.get(fmt, "image/png")
          x = (512 - fitted_width) // 2
          y = (512 - fitted_height) // 2
          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">'
              '<rect width="512" height="512" fill="' + background + '"/>'
              '<image x="' + str(x) + '" y="' + str(y) + '" width="' + str(fitted_width) + '" height="' + str(fitted_height) + '" '
              'preserveAspectRatio="none" href="data:' + mime + ';base64,' + data + '"/>'
              '</svg>'
          )
          Path("brand-assets/logos/asiatech-color.svg").write_text(svg, encoding="utf-8")
          print(f"Asiatech square asset: {width}x{height} -> {fitted_width}x{fitted_height}, background {background}")
          PY
          grep -q "<svg" brand-assets/logos/asiatech-color.svg

      - name: Download user-provided Telecommunication Company of Iran logo
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://media.hamshahrionline.ir/d/2022/07/11/4/4699873.jpg?ts=1657543367000" \
            --output /tmp/telecommunication-company-of-iran-logo.jpg
          file /tmp/telecommunication-company-of-iran-logo.jpg
          test "$(stat -c%s /tmp/telecommunication-company-of-iran-logo.jpg)" -gt 500
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/telecommunication-company-of-iran-logo.jpg").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/jpeg;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/telecommunication-company-of-iran-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/telecommunication-company-of-iran-color.svg

      - name: Download official Tara logo asset
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 "https://tara360.ir/wp-content/uploads/2024/08/tar_sanfi_v3.png" --output /tmp/tara-logo.png
          file /tmp/tara-logo.png
          test "$(stat -c%s /tmp/tara-logo.png)" -gt 1000
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/tara-logo.png").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/tara-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/tara-color.svg
          test "$(stat -c%s brand-assets/logos/tara-color.svg)" -gt 1000

      - name: Download user-provided Dima logo
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://appkhan.com/wp-content/uploads/2025/12/dima-icon.png" \
            --output /tmp/dima-logo.png
          file /tmp/dima-logo.png
          test "$(stat -c%s /tmp/dima-logo.png)" -gt 1000
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/dima-logo.png").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/dima-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/dima-color.svg
          test "$(stat -c%s brand-assets/logos/dima-color.svg)" -gt 1000

      - name: Download requested insurance brand logos
        run: |
          mkdir -p brand-assets/logos
          curl --fail --location --retry 3 --retry-delay 2 \\
            "https://play-lh.googleusercontent.com/xmaCGYa5le0y-iDkC5PX44GSjGkv7rHVmlGRbJK1qMNwBeXRhDidnqDVpDZlJmmLAu0M2PmllVf-q-2WBJ3GhXY=w512-h512-rw" \\
            --output /tmp/azki-app-logo.png
          file /tmp/azki-app-logo.png
          test "$(stat -c%s /tmp/azki-app-logo.png)" -gt 1000
          python - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/azki-app-logo.png").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/azki-insurance-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/azki-insurance-color.svg
          test "$(stat -c%s brand-assets/logos/azki-insurance-color.svg)" -gt 1000
          curl --fail --location --retry 3 --retry-delay 2 \\
            "https://cdn.brandfetch.io/idqSUBvqtx/theme/dark/logo.svg?c=1bxid64Mup7aczewSAYMX&t=1781795732537" \\
            --output brand-assets/logos/bimehdotcom-color.svg
          curl --fail --location --retry 3 --retry-delay 2 \\
            "https://dmboard.media/wp-content/uploads/2025/08/Picture1-3-scaled.png" \\
            --output /tmp/bimebazar-logo.png
          file /tmp/bimebazar-logo.png
          test "$(stat -c%s /tmp/bimebazar-logo.png)" -gt 1000
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64encode(Path("/tmp/bimebazar-logo.png").read_bytes()).decode("ascii")
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,' + data + '"/></svg>'
          Path("brand-assets/logos/bimebazar-color.svg").write_text(svg, encoding="utf-8")
          PY
          grep -q "<svg" brand-assets/logos/bimebazar-color.svg
          test "$(stat -c%s brand-assets/logos/bimebazar-color.svg)" -gt 1000
          file brand-assets/logos/bimebazar-color.svg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test brand matcher
        run: node brand-assets/catalog/test-brand-matcher.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract updated project and prepare Vazirmatn
        run: |
          mkdir app
          unzip -o project-updated.zip -d app
          cd app
          sed -i 's#cursor-default"/>}}#cursor-default"/>}#' src/App.tsx
          # Match the CSS URL to the actual font filename (literal square brackets).
          sed -i 's#Vazirmatn\[wght\]\.woff2#Vazirmatn-wght.woff2#g' src/index.css
          # Ensure the native Android status bar is explicitly visible and the WebView does not draw behind it.
          sed -i "s/void StatusBar.setOverlaysWebView({ overlay: false })/void StatusBar.show().catch(() => {}); void StatusBar.setOverlaysWebView({ overlay: false })/" src/App.tsx
          # Patch the reminder settings and real scheduled notifications in the extracted app source.
          python3 ../.github/scripts/patch_reminders.py
          python3 ../.github/scripts/fix_reminders.py
          # Guard debt creation against UUID/WebView failures and catch pre-save exceptions.
          python3 ../.github/scripts/patch_safe_save.py
          # Keep the app header fixed while content scrolls underneath, with a soft fading lower edge.
          python3 ../.github/scripts/patch_header.py
          python3 ../.github/scripts/patch_brand_and_scroll.py
          # Add offline brand recognition and the verified SVG logo archive to the app.
          python3 ../.github/scripts/integrate_brand_assets.py
          mkdir -p public assets
          cp ../nadadam-logo.png public/logo.png
          cp ../nadadam-logo.png assets/icon-only.png
          # Export the actual project sources for precise review before editing.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("/tmp/nadadam-source-inspection")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          for name in ["src", "package.json", "capacitor.config.json", "capacitor.config.ts", "vite.config.ts", "tsconfig.json"]:
              p = Path(name)
              if p.is_dir(): shutil.copytree(p, root / p.name)
              elif p.is_file(): shutil.copy2(p, root / p.name)
          PY
          mkdir -p /tmp/nadadam-inspection-artifact
          cp -a /tmp/nadadam-source-inspection /tmp/nadadam-inspection-artifact/source
          # Apply the selected font consistently to form controls as well.
          cat >> src/index.css <<'CSS'

          body, button, input, textarea, select {
            font-family: 'Vazirmatn', system-ui, sans-serif;
          }
          CSS
          npm install
          npm install --no-save vazirmatn@33.0.3
          mkdir -p public/fonts
          FONT_FILE="$(find node_modules/vazirmatn -type f -name '*wght*.woff2' -print -quit)"
          test -n "$FONT_FILE"
          cp "$FONT_FILE" public/fonts/Vazirmatn-wght.woff2
          npm run build
          # Fail the build if the compiled CSS still points at the wrong font path.
          grep -q '/fonts/Vazirmatn-wght.woff2' dist/assets/*.css
          npx cap add android
          # Exact alarms are required for reminders to fire at the selected clock time on Android 12+.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos+1] + "\\n    " + permission + s[pos+1:]
              p.write_text(s)
          PY
          npx capacitor-assets generate --android
          npx cap sync android
          # Override the adaptive launcher foreground with the exact approved in-app logo.
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          source = Image.open("public/logo.png").convert("RGBA")
          white = Image.new("RGB", source.size, (255, 255, 255))
          difference = ImageChops.difference(source.convert("RGB"), white)
          mask = difference.convert("L").point(lambda value: 255 if value > 22 else 0)
          bounds = mask.getbbox()
          if not bounds:
              raise SystemExit("Could not detect the logo artwork.")
          artwork = source.crop(bounds)
          scale = min(300 / artwork.width, 300 / artwork.height)
          size = (round(artwork.width * scale), round(artwork.height * scale))
          artwork = artwork.resize(size, Image.Resampling.LANCZOS)
          foreground = Image.new("RGBA", (432, 432), (255, 255, 255, 255))
          foreground.alpha_composite(artwork, ((432 - size[0]) // 2, (432 - size[1]) // 2))
          for density, pixels in {
              "ldpi": 81, "mdpi": 108, "hdpi": 162,
              "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432
          }.items():
              output = Path(f"android/app/src/main/res/mipmap-{density}/ic_launcher_foreground.png")
              output.parent.mkdir(parents=True, exist_ok=True)
              foreground.resize((pixels, pixels), Image.Resampling.LANCZOS).save(output)
          print("Adaptive launcher foreground replaced with the approved teal wallet logo.")
          PY
          # Android status-bar notification icons must be monochrome silhouettes with transparent backgrounds.
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_nadadam.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2C10.9,2 10,2.9 10,4v0.3C7.1,5.2 5,7.9 5,11v5l-2,2v1h18v-1l-2,-2v-5c0,-3.1 -2.1,-5.8 -5,-6.7V4c0,-1.1 -0.9,-2 -2,-2zM9,20h6c0,1.7 -1.3,3 -3,3s-3,-1.3 -3,-3z"/>
          </vector>
          XML

      - name: Upload source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nadadam-source-inspection
          path: /tmp/nadadam-inspection-artifact
          if-no-files-found: warn

      - name: Configure permanent APK signing
        env:
          NADADAM_KEYSTORE_BASE64: ${{ secrets.NADADAM_KEYSTORE_BASE64 }}
          NADADAM_STORE_PASSWORD: ${{ secrets.NADADAM_STORE_PASSWORD }}
          NADADAM_KEY_ALIAS: ${{ secrets.NADADAM_KEY_ALIAS }}
          NADADAM_KEY_PASSWORD: ${{ secrets.NADADAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$NADADAM_KEYSTORE_BASE64" ] || [ -z "$NADADAM_STORE_PASSWORD" ] || [ -z "$NADADAM_KEY_ALIAS" ] || [ -z "$NADADAM_KEY_PASSWORD" ]; then
            echo "Permanent signing secrets are not configured; building with the temporary debug signature."
            exit 0
          fi
          cd app/android/app
          printf '%s' "$NADADAM_KEYSTORE_BASE64" | base64 --decode > nadadam-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              block = '''    signingConfigs {
              release {
                  storeFile file("nadadam-release.jks")
                  storePassword System.getenv("NADADAM_STORE_PASSWORD")
                  keyAlias System.getenv("NADADAM_KEY_ALIAS")
                  keyPassword System.getenv("NADADAM_KEY_PASSWORD")
              }
          }
          '''
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in s:
              s = s.replace("    buildTypes {", "    buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }", 1)
          p.write_text(s)
          PY
          keytool -list -keystore nadadam-release.jks -storepass "$NADADAM_STORE_PASSWORD" -alias "$NADADAM_KEY_ALIAS" >/dev/null

      - name: Build APK
        env:
          NADADAM_STORE_PASSWORD: ${{ secrets.NADADAM_STORE_PASSWORD }}
          NADADAM_KEY_ALIAS: ${{ secrets.NADADAM_KEY_ALIAS }}
          NADADAM_KEY_PASSWORD: ${{ secrets.NADADAM_KEY_PASSWORD }}
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nadadam-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
